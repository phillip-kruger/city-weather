# A House Elves elf: what Elf Desk needs to install, set up and run city-weather. AGENTS.md says what each field means.
name: city-weather
title: City weather
version: 0.2.0
author: "@phillip-kruger"
description: Shows the weather now and the next three days (icons, highs, lows, chance of rain) and today's sunrise and sunset for the cities you pick, refreshed every morning and on click.
main: CityWeather.java
config: ~/.config/city-weather/config

reads:
  - Open-Meteo's free geocoding service (geocoding-api.open-meteo.com), to find where each city you list is.
  - Open-Meteo's free forecast service (api.open-meteo.com), for the current weather and the next three days in those cities.
  - Its own settings on this machine.
writes:
  - Nothing outside this machine. It sends your city names to Open-Meteo to look them up, and saves the forecasts as small files in its own folder in ~/.config/city-weather/.

settings:
  - key: CITIES
    label: Cities
    help: "The cities to show, separated by semicolons, like: Paris, France; Tokyo; Austin, Texas. Adding a country or region after a comma helps when names are shared."
    kind: text
    default: "Melbourne; Brno; Raleigh"
  - key: FAHRENHEIT
    label: Use Fahrenheit and mph
    help: Off shows Celsius and km/h. On shows Fahrenheit and mph.
    kind: bool
    default: "false"

commands:
  read:
    label: Refresh
    args: [--save]
  dry-run:
    label: Look up without saving
    args: []

dry-run: dry-run

# Its tab (and dashboard card), drawn by ui/city-weather.js in the desk's sandboxed frame. It reads only what it saved.
tab:
  page: ui/city-weather.js
  card: true
refresh:
  command: read
  schedule: "Mon..Sun *-*-* 06:30"
data: [forecast]
